[[sources]]
name = "OitoMeia"
type = "listing"
url = "https://www.oitomeia.com.br/noticias/"
allow_domains = ["www.oitomeia.com.br"]
link_selector = "a[href]"
allow_url_patterns = ["/noticias/"]
deny_url_patterns = [
  "/categoria/", "/tag/", "/contato", "/quem-somos",
  "whatsapp.com", "wa.me", "twitter.com", "facebook.com", "instagram.com"]

[[sources]]
name = "Portal AZ"
type = "listing"
url = "https://www.portalaz.com.br/ultimas-noticias/"
allow_domains = ["www.portalaz.com.br"]
link_selector = "a[href]"
allow_url_patterns = ["/noticia/|/noticias/|/materia/"]
deny_url_patterns = [
  "/editorias/", "/colunas/", "/institucional/",
  "/politica-de-privacidade", "/cookies",
  "whatsapp.com", "wa.me", "twitter.com"]

[sources.pagination]
mode = "query"
page_param = "page"
start = 1
end = 100

[[sources]]
name = "GP1"
type = "listing"
url = "https://www.gp1.com.br/ultimas-noticias/"
allow_domains = ["www.gp1.com.br"]
link_selector = "a[href*='/noticia/']"
allow_url_patterns = ["/noticia/20\\d{2}/\\d{1,2}/\\d{1,2}/"]
deny_url_patterns = [
  "/blogs-e-colunas/", "/tv/", "/noticias-sobre/",
  "/institucional/", "/galerias/",
  "whatsapp.com", "wa.me", "twitter.com", "facebook.com", "instagram.com"
]

[sources.pagination]
mode = "query"
page_param = "page"
start = 1
end = 100