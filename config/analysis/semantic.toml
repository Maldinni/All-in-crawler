[definition]
max_article_number = 9
required_fields = ['Palavras-chave', 'Título', 'Descrição', 'Foco']

[distinction]
max_article_number = 9
required_fields = ['Características Distintivas']

[questions]
required_fields = ['Questões em Aberto']

[trends]
max_article_number = 9
# Divide cada cluster pela mediana das próprias datas (melhor cobertura em
# janelas curtas). Coloque false para voltar aos cortes fixos por ano abaixo.
adaptive_cutoff = true
older_cutoff = 2025
recent_cutoff = 2026
required_fields = [
                 'Narrativas Emergentes',
                 'Atores Emergentes',
                 'Narrativas em Declínio',
                 'Atores em Declínio'
                 ]

[dimensions]
max_article_number = 9
older_cutoff = 2025
recent_cutoff = 2026
required_fields = [
                'Dimensão 1 - Posicionamento Social e Político',
                'Dimensão 2 - Tom Emocional',
                'Dimensão 3 - Enquadramento do Problema',
                'Dimensão 4 - Centralidade de Atores Sociais',
                'Dimensão 5 - Foco em Instituições ou Indivíduos',
                'Dimensão 6 - Alcance Nacional ou Internacional',
                'Dimensão 7 - Evento Pontual ou Problema Estrutural',
                'Dimensão 8 - Uso de Evidências e Fontes',
                'Dimensão 9 - Tipo de Veículo de Mídia'
        ]

[llm]
temperature = 0.1
model_name = 'qwen2.5:3b-instruct-q5_K_M'   # 3b instruct quantizado em q5 (~2,3 GB); cabe em 8 GB (M2 Air) e recupera qualidade vs. o q4 padrao
num_ctx = 8192              # evita o truncamento silencioso que ocorria no default 2048 (prompts tem ~3-4.5k tokens); KV cache do 3b ~0.3 GB
keep_alive = '30m'          # mantem o modelo residente entre clusters p/ nao recarregar; troque por '0' para liberar a RAM assim que terminar
delay = 0.5
retries = 5